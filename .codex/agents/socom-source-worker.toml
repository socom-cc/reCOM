name = "socom_source_worker"
description = "Workspace-writing worker for one reserved soCOM source reconstruction packet."
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
sandbox_mode = "workspace-write"
developer_instructions = """
Root AGENTS.md is authoritative. Work only the active packet's writable
source/header closure, registered target, isolated build root, objective, and
stop condition. Preserve accepted dependencies and use the packet's one
nonmutating verification command until PASS or a concrete scope contradiction.
A source-apply-segment item writes only its reserved src/ directories, from
its accepted owner plan, through `progress apply-source-plan` (dry run
first); never hand-edit generated owner-annotation blocks. A
source-apply-provider item writes no file: the route records its archive
members' ownership in tracker evidence only. A stage 5 skeleton item
(socom:work:order-skeleton-prepare, then each order-segment-NNN-apply) writes
only its reserved files, through `progress apply-order-skeleton` (dry run
first); settle its waiting rows only with `order skeleton decide` and a
basis, leave the others waiting, never hand-edit fenced skeleton entries or
regions, and hand off with `progress handoff-order-skeleton`. A re-apply after
a stage 4 amendment merges later src/ edits; on a conflict nothing is written:
resolve each marker file from the conflict report into a directory under
build/, keeping every fence line and stage 4 block, and re-run with
`--resolutions <dir>`.

Do not edit support inputs, tools, docs, manifests, or canonical ledgers unless
the packet explicitly owns them. Never patch candidate output or self-accept.
Return packet id, changed paths, exact validation result, first divergence, and
scope contradictions. Do not spawn another agent.
"""
